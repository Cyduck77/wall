<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WALL // cyber news</title>
<meta name="description" content="Live cybersecurity news wall — multi-source, deduplicated headlines">
<meta name="theme-color" content="#0a0e0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WALL">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#0a0e0b; --panel:#0f1511; --panel2:#131b16; --line:#1d2a22;
  --text:#d3f5dc; --dim:#7d9a86; --faint:#4a6352; --green:#39ff88;
  --breach:#ff4d5e; --cve:#ff9f1c; --ransomware:#b46cff; --general:#8aa394; --threat:#ffd23f;
  --policy:#3fa7ff; --social:#ff5fc8; --tracker:#22d3ee; --hotred:#ff3b4e;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mono)}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.ti{font-size:1.15em;vertical-align:-.12em;line-height:1}
.wrap{max-width:760px;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(10,14,11,.94);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px 10px}
.prompt{flex:1;min-width:0;display:flex;align-items:center;gap:6px;cursor:text}
.logo{flex:none;font-weight:700;font-size:20px;letter-spacing:.5px;color:var(--green);text-shadow:0 0 12px rgba(57,255,136,.45)}
.gt{color:var(--green);font-weight:700;font-size:18px}
#q{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:16px;padding:4px 0;
  caret-color:var(--green);-webkit-appearance:none;appearance:none;border-bottom:1px dashed transparent}
#q:focus{border-bottom-color:var(--faint)}
#q::placeholder{color:var(--faint)}
#q::-webkit-search-cancel-button{display:none}
.clear{background:none;border:0;color:var(--dim);font-size:18px;padding:0 4px;cursor:pointer}
.status{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--dim);white-space:nowrap}
.status b{font-weight:500;color:var(--green)}
.status.stale b{color:var(--cve)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s infinite}
.status.stale .dot{background:var(--cve);box-shadow:0 0 8px var(--cve);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes blink{50%{opacity:0}}
.cursor{display:inline-block;width:.55em;height:1em;background:var(--green);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}

/* topic chips */
.topics{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,#000 86%,transparent);mask-image:linear-gradient(90deg,#000 86%,transparent)}
.topics::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--dim);
  font-size:12px;padding:6px 11px;border-radius:999px;cursor:pointer;transition:border-color .15s,color .15s}
.chip .ti{color:var(--c)}
.chip .n{color:var(--faint);font-size:11px}
.chip:hover{color:var(--text)}
.chip.on{color:#06110a;background:var(--c);border-color:var(--c);font-weight:500}
.chip.on .ti,.chip.on .n{color:#06110a}

/* source switch */
.sourcebar{display:flex;align-items:center;gap:10px;padding:0 16px 12px;font-size:11px;color:var(--dim)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{background:none;border:0;border-left:1px solid var(--line);color:var(--dim);font-size:11px;padding:5px 10px;cursor:pointer;
  display:flex;align-items:center;gap:5px;white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button:hover{color:var(--text)}
.seg button.on{background:rgba(57,255,136,.12);color:var(--green)}
.seg button .ti{font-size:13px}
.reset{margin-left:auto;background:none;border:0;color:var(--dim);font-size:11px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.reset:hover{color:var(--text)}
@media (min-width:700px){
  .topics{flex-wrap:wrap;overflow:visible;-webkit-mask-image:none;mask-image:none}
}
@media (max-width:420px){ .seg button .lbl-long{display:none} .seg button .lbl-short{display:inline!important} .sourcebar>span:first-child{display:none} }

.demo{margin:12px 16px 0;padding:8px 12px;border:1px dashed var(--cve);color:var(--cve);font-size:11px;border-radius:6px}

/* ---------- feed ---------- */
main{padding:4px 12px 80px}
.sep{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:11px;margin:18px 4px 8px;text-transform:uppercase;letter-spacing:1px}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.sep.brk-sep{color:var(--hotred)}
.sep.brk-sep::before,.sep.brk-sep::after{background:rgba(255,59,78,.35)}
.hits{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:12px;margin:14px 4px 2px}

.card{position:relative;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:8px;
  margin:8px 0;padding:12px 14px 11px;cursor:pointer;transition:background .15s}
.card:hover{background:var(--panel2)}
.card.social-only{border-left-style:dashed}
.card.is-brk{box-shadow:0 0 0 1px rgba(255,59,78,.35),0 0 18px rgba(255,59,78,.12)}
.card.new{animation:flash 2.4s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 1px var(--green),0 0 22px rgba(57,255,136,.35);transform:translateY(-6px);opacity:0}
  15%{transform:none;opacity:1}100%{box-shadow:none}}

.meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim);margin-bottom:6px;flex-wrap:wrap}
.tag{color:var(--c);font-weight:700;letter-spacing:.6px;text-transform:uppercase;display:flex;align-items:center;gap:5px}
.via{color:var(--social)}
.brk{color:#fff;background:var(--hotred);font-weight:700;font-size:10px;letter-spacing:.6px;border-radius:3px;padding:1px 6px;animation:pulse 1.6s infinite}
.hot{color:var(--cve)}
.new-badge{margin-left:auto;color:#06110a;background:var(--green);font-weight:700;font-size:9px;letter-spacing:.8px;border-radius:3px;padding:1px 5px}
.title{font-size:15px;line-height:1.45;font-weight:500;color:var(--text)}
.groups{font-size:12px;color:var(--ransomware);margin-top:6px;line-height:1.5}
.groups span{color:var(--dim)}

.foot{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:2px 7px;color:var(--text)}
.badge .ti{color:var(--dim);font-size:13px}
.badge.k-social{border-color:rgba(255,95,200,.5);color:var(--social)} .badge.k-social .ti{color:var(--social)}
.badge.k-leak,.badge.k-hibp{border-color:rgba(34,211,238,.45);color:var(--tracker)} .badge.k-leak .ti,.badge.k-hibp .ti{color:var(--tracker)}
.toggle{display:inline-flex;align-items:center;gap:4px;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);
  border-radius:4px;padding:2px 7px;background:none;font-size:11px;cursor:pointer}
.toggle .ti{transition:transform .2s;font-size:12px}
.card.open .toggle .ti{transform:rotate(180deg)}
.soc-count{color:var(--social);display:inline-flex;align-items:center;gap:4px}

.detail{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:4px}
.card.open .detail{display:block}
.row{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;font-size:12px;border-bottom:1px solid rgba(29,42,34,.6);border-radius:4px}
.row:hover{background:rgba(57,255,136,.04)}
.row:last-child{border-bottom:0}
.row .t{color:var(--faint);flex:none;width:58px;padding-top:1px}
.row .n{color:var(--text);flex:1;min-width:0}
.row .n .who{display:flex;align-items:center;gap:6px}
.row .n .who .ti{color:var(--dim);font-size:13px}
.row .n.k-social .who,.row .n.k-social .who .ti{color:var(--social)}
.row .n.k-leak .who,.row .n.k-leak .who .ti,.row .n.k-hibp .who,.row .n.k-hibp .who .ti{color:var(--tracker)}
.row .n .hl{display:block;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.row .go{color:var(--c);flex:none}
.first{color:#06110a;background:var(--green);font-size:9px;font-weight:700;letter-spacing:.6px;border-radius:3px;padding:0 4px}
mark{background:rgba(57,255,136,.18);color:var(--green);border-radius:2px;padding:0 1px}

.newpill{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 130px);z-index:30;
  background:var(--green);color:#04120a;font-size:12px;font-weight:700;border:0;border-radius:999px;
  padding:7px 14px;box-shadow:0 4px 20px rgba(57,255,136,.4);display:none;cursor:pointer}
.empty{color:var(--dim);text-align:center;padding:56px 20px;font-size:13px;line-height:1.7}
.empty b{color:var(--text);font-weight:500;display:block;font-size:14px;margin-bottom:4px}
.empty button{margin-top:12px;background:none;border:1px solid var(--line);border-radius:6px;color:var(--green);padding:6px 12px;cursor:pointer}
footer{color:var(--faint);font-size:11px;text-align:center;padding:12px 16px 32px;line-height:1.7}
footer .down{color:var(--cve)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <label class="prompt" for="q"><span class="logo">&gt;_wall</span><span class="gt">&gt;</span>
        <span class="sr">Search stories</span>
        <input id="q" type="search" placeholder="search companies, CVEs, gangs…" autocomplete="off" autocorrect="off"
          autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <button class="clear" id="clear" aria-label="Clear search" hidden><i class="ti ti-x"></i></button></label>
      <div class="status" id="status" title=""><span class="dot"></span><b id="live">Live</b><span id="synced">…</span></div>
    </div>
    <nav class="topics" id="topics" aria-label="Topics"></nav>
    <div class="sourcebar">
      <span>From</span>
      <div class="seg" id="sources" role="group" aria-label="Source type"></div>
      <button class="reset" id="reset" hidden>Clear filters</button>
    </div>
  </div>
</header>
<div class="wrap">
  <div class="demo" id="demo" hidden>Demo data: sample headlines only, the collector isn't connected yet. Links go nowhere.</div>
  <main id="feed"><div class="empty">Loading the wall<span class="cursor"></span></div></main>
  <footer id="foot"></footer>
</div>
<button class="newpill" id="newpill"></button>

<script>
/* ---------- vocabulary ---------- */
const TOPICS = {
  all:        {label:"All",              tag:"",               icon:"ti-layout-list",  c:"var(--green)"},
  breach:     {label:"Breaches",         tag:"Breach",         icon:"ti-database-x",   c:"var(--breach)"},
  ransomware: {label:"Ransomware",       tag:"Ransomware",     icon:"ti-skull",        c:"var(--ransomware)"},
  cve:        {label:"Vulnerabilities",  tag:"Vulnerability",  icon:"ti-bug",          c:"var(--cve)"},
  threat:     {label:"Malware and APTs", tag:"Malware / APT",  icon:"ti-virus",        c:"var(--threat)"},
  policy:     {label:"Law and policy",   tag:"Law / policy",   icon:"ti-scale",        c:"var(--policy)"},
  general:    {label:"Industry",         tag:"Industry",       icon:"ti-building",     c:"var(--general)"},
};
const SOURCES = {
  all:      {label:"All",           icon:""},
  news:     {label:"News",          icon:"ti-news"},
  social:   {label:"Social",        icon:"ti-message-circle"},
  trackers: {label:"Leak trackers", short:"Trackers", icon:"ti-radar"},
};
const KIND_GROUP = {news:"news", vendor:"news", advisory:"news", social:"social", leak:"trackers", hibp:"trackers"};
const KIND_ICON = {news:"ti-news", vendor:"ti-flask", advisory:"ti-shield-check", leak:"ti-radar", hibp:"ti-shield-search", social:"ti-message-circle"};
const PLATFORM = {
  telegram:{name:"Telegram", icon:"ti-brand-telegram"},
  bluesky: {name:"Bluesky",  icon:"ti-butterfly"},
  mastodon:{name:"Mastodon", icon:"ti-brand-mastodon"},
};
const POLL_MS = 60000;

/* ---------- state ---------- */
let topic = "all", source = "all", stories = [], known = new Set(), firstLoad = true, generatedAt = null, opened = new Set();
let query = "", terms = [], lastGen = null, seen = new Set(), limit = 120, sourcesInfo = null;
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
};
seen = new Set(store.get("wall.seen", []));
topic = TOPICS[store.get("wall.topic", "all")] ? store.get("wall.topic", "all") : "all";
source = SOURCES[store.get("wall.source", "all")] ? store.get("wall.source", "all") : "all";
const hadHistory = seen.size > 0;
const prevVisit = store.get("wall.lastVisit", null);          // null on the very first visit
const markVisit = () => store.set("wall.lastVisit", Date.now());
const saveSeen = () => store.set("wall.seen", [...seen].slice(-3000));

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "#";
const icon = (name, extra="") => name ? `<i class="ti ${name} ${extra}" aria-hidden="true"></i>` : "";
const reEsc = t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function hl(text){
  text = String(text ?? "");
  if (!terms.length) return esc(text);
  const rx = new RegExp("(" + terms.map(reEsc).join("|") + ")", "gi");
  return text.split(rx).map((p, i) => i % 2 ? `<mark>${esc(p)}</mark>` : esc(p)).join("");
}
function ago(ts, suffix = true){
  const s = Math.max(0, (Date.now() - ts) / 1000);
  let v;
  if (s < 60) return "just now";
  if (s < 3600) v = Math.floor(s/60) + "m";
  else if (s < 86400) v = Math.floor(s/3600) + "h";
  else v = Math.floor(s/86400) + "d";
  return suffix ? v + " ago" : v;
}
function dayLabel(ts){
  const d = new Date(ts), t = new Date(); t.setHours(0,0,0,0);
  const diff = Math.round((t - new Date(d).setHours(0,0,0,0)) / 86400000);
  if (diff <= 0) return "Today";
  if (diff === 1) return "Yesterday";
  return d.toLocaleDateString(undefined, {weekday:"long", day:"numeric", month:"short"});
}
function who(x){
  if (x.kind === "social"){
    const p = PLATFORM[x.platform] || {name:"Social", icon:"ti-message-circle"};
    return {icon:p.icon, name:x.name.replace(/^[^·]+·\s*/, ""), sub:p.name};
  }
  return {icon:KIND_ICON[x.kind] || "ti-news", name:x.name, sub:""};
}

/* ---------- data ---------- */
function normalize(data){
  const shift = data.demo ? Date.now() - Date.parse(data.generated_at) : 0;   // demo data: newest = now
  generatedAt = Date.parse(data.generated_at) + shift;
  $("demo").hidden = !data.demo;
  sourcesInfo = data.sources || null;
  return (data.stories || []).map(s => {
    const sources = (s.sources || []).map(x => ({...x, ts: Date.parse(x.published) + shift})).sort((a,b) => a.ts - b.ts);
    const tag = s.tag === "pwned" ? "breach" : (TOPICS[s.tag] && s.tag !== "all" ? s.tag : "general");
    const kinds = s.bundle ? new Set(["trackers"]) : new Set(sources.map(x => KIND_GROUP[x.kind] || "news"));
    const st = {
      ...s, tag, sources, kinds, groupsTop: s.groups || [],
      socialOnly: !!s.social_only,
      first: Date.parse(s.first_seen) + shift,
      last: Date.parse(s.updated || s.first_seen) + shift,
      hay: [s.title, ...(s.sources || []).flatMap(x => [x.name, x.title])].join(" \n ").toLowerCase(),
    };
    // BREAKING: 4+ sources within 6h of the first report, first report < 12h old
    const early = sources.filter(x => x.ts - st.first <= 6*3600e3).length;
    st.breaking = !s.bundle && early >= 4 && Date.now() - st.first < 12*3600e3;
    return st;
  }).sort((a,b) => b.last - a.last);
}
const byTopic  = (s, t = topic)  => t === "all" || s.tag === t;
const bySource = (s, f = source) => f === "all" || s.kinds.has(f);
const byQuery  = s => !terms.length || terms.every(t => s.hay.includes(t));
const visible  = s => byTopic(s) && bySource(s) && byQuery(s);

/* ---------- controls ---------- */
function renderControls(){
  const pool = stories.filter(s => bySource(s) && byQuery(s));
  $("topics").innerHTML = Object.entries(TOPICS).map(([k, v]) => {
    const n = k === "all" ? pool.length : pool.filter(s => s.tag === k).length;
    if (k !== "all" && k !== topic && !n) return "";
    return `<button class="chip ${topic===k?"on":""}" data-topic="${k}" style="--c:${v.c}" aria-pressed="${topic===k}">
      ${icon(v.icon)}${esc(v.label)} <span class="n">${n}</span></button>`;
  }).join("");
  $("sources").innerHTML = Object.entries(SOURCES).map(([k, v]) =>
    `<button class="${source===k?"on":""}" data-source="${k}" aria-pressed="${source===k}">${icon(v.icon)}${
      v.short ? `<span class="lbl-long">${esc(v.label)}</span><span class="lbl-short" style="display:none">${esc(v.short)}</span>` : esc(v.label)}</button>`
  ).join("");
  $("reset").hidden = topic === "all" && source === "all";
}

/* ---------- cards ---------- */
// NEW = first reported since your previous visit (or arrived while the page was open), and not opened yet
const isUnseen = s => !seen.has(s.id) && ((prevVisit && s.first > prevVisit) || (!firstLoad && arrivedLive.has(s.id)));
const arrivedLive = new Set();
const autoOpen = s => terms.length && !terms.every(t => s.title.toLowerCase().includes(t));

function rowsHTML(rows, {firstMark = true, groupLabel = false} = {}){
  return rows.map((x, i) => {
    const w = who(x);
    const label = groupLabel ? `<b>${esc(x.name)}</b>` : `${icon(w.icon)}${esc(w.name)}${w.sub ? ` <span style="color:var(--faint)">· ${w.sub}</span>` : ""}`;
    return `<a class="row" href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener noreferrer">
      <span class="t">${ago(x.ts)}</span>
      <span class="n k-${esc(x.kind)}"><span class="who">${label}${firstMark && i===0 ? `<span class="first">FIRST TO REPORT</span>` : ""}</span>
        <span class="hl">${hl(x.title || "")}</span></span>
      <span class="go">${icon("ti-external-link")}</span></a>`;
  }).join("");
}

function bundleCard(s, isNew){
  const n = s.sources.length, groups = s.groupsTop;
  const top = groups.slice(0, 4).map(([name, k]) => `${esc(name)} <span>${k}</span>`).join(" · ") + (groups.length > 4 ? ` · <span>+${groups.length-4} more</span>` : "");
  const via = [...new Set(s.sources.flatMap(x => (x.via || []).map(v => v.replace(/^[^·]+·\s*/, ""))))].slice(0, 3).join(", ") || "ransomware.live";
  return `<article class="card ${isNew?"new":""} ${opened.has(s.id) || autoOpen(s) ? "open" : ""}" data-id="${esc(s.id)}" style="--c:var(--ransomware)">
    <div class="meta"><span class="tag">${icon("ti-skull")}Ransomware claims</span><span>${ago(s.last)}</span>${isUnseen(s)?`<span class="new-badge">NEW</span>`:""}</div>
    <div class="title">${n} ${n===1?"company":"companies"} listed on ransomware leak sites</div>
    ${top ? `<div class="groups">Most active: ${top}</div>` : ""}
    <div class="foot"><span class="badge k-leak">${icon("ti-radar")}${esc(via)}</span>
      <button class="toggle" type="button">${opened.has(s.id) ? "Hide" : "Show"} all ${n} victims ${icon("ti-chevron-down")}</button></div>
    <div class="detail">${rowsHTML([...s.sources].reverse(), {firstMark:false, groupLabel:true})}</div>
  </article>`;
}

function card(s, isNew){
  if (s.bundle) return bundleCard(s, isNew);
  const T = TOPICS[s.tag], n = s.sources.length, first = s.sources[0] || {name:s.source, kind:"news"};
  const w = who(first), nSocial = s.sources.filter(x => x.kind === "social").length;
  const c = s.socialOnly ? "var(--social)" : T.c;
  const firstPlatform = s.socialOnly ? (PLATFORM[first.platform]?.name || "social") : "";
  return `<article class="card ${s.socialOnly?"social-only":""} ${s.breaking?"is-brk":""} ${isNew?"new":""} ${opened.has(s.id) || autoOpen(s) ? "open" : ""}"
      data-id="${esc(s.id)}" style="--c:${c}">
    <div class="meta">${s.breaking ? `<span class="brk">BREAKING</span>` : ""}
      <span class="tag" style="color:${T.c}">${icon(T.icon)}${esc(T.tag)}</span>
      ${s.socialOnly ? `<span class="via">${icon("ti-message-circle")} only on ${esc(firstPlatform)}</span>` : ""}
      <span>${ago(s.last)}</span>
      ${n >= 5 && !s.breaking ? `<span class="hot">${icon("ti-trending-up")} Trending</span>` : ""}
      ${isUnseen(s) ? `<span class="new-badge">NEW</span>` : ""}</div>
    <div class="title">${hl(s.title)}</div>
    <div class="foot">
      <span class="badge k-${esc(first.kind)}">${icon(w.icon)}${esc(w.name)}</span>
      ${n > 1 ? `<button class="toggle" type="button">+${n-1} more ${n-1===1?"source":"sources"} ${icon("ti-chevron-down")}</button>` : ""}
      ${nSocial && !s.socialOnly ? `<span class="soc-count">${icon("ti-message-circle")}${nSocial} social ${nSocial===1?"post":"posts"}</span>` : ""}
    </div>
    <div class="detail">${rowsHTML(s.sources)}</div>
  </article>`;
}

/* ---------- render ---------- */
function emptyHTML(){
  if (terms.length) return `<div class="empty"><b>Nothing matches “${esc(query)}”</b>Only the last 7 days are searchable. Try a company, CVE or gang name.
    ${topic!=="all"||source!=="all" ? `<br><button data-act="reset">Search all topics and sources</button>` : ""}</div>`;
  return `<div class="empty"><b>No ${esc(TOPICS[topic].label.toLowerCase())} stories ${source!=="all" ? "from " + esc(SOURCES[source].label.toLowerCase()) : ""} this week</b>
    New stories arrive every 10 minutes.<br><button data-act="reset">Show everything</button></div>`;
}

function render(newIds = new Set()){
  renderControls();
  const list = stories.filter(visible);
  if (!list.length){ $("feed").innerHTML = emptyHTML(); renderFooter(); return; }
  let html = terms.length ? `<div class="hits">${icon("ti-search")}${list.length} ${list.length===1?"story matches":"stories match"} “${esc(query)}”</div>` : "";
  let rest = list, last = "";
  if (!terms.length){
    const pinned = list.filter(s => s.breaking).sort((a,b) => b.sources.length - a.sources.length).slice(0, 3);
    if (pinned.length){
      html += `<div class="sep brk-sep">Breaking now</div>` + pinned.map(s => card(s, newIds.has(s.id))).join("");
      const ids = new Set(pinned.map(s => s.id));
      rest = list.filter(s => !ids.has(s.id));
    }
  }
  for (const s of rest.slice(0, limit)){
    const d = dayLabel(s.last);
    if (d !== last){ html += `<div class="sep">${esc(d)}</div>`; last = d; }
    html += card(s, newIds.has(s.id));
  }
  if (rest.length > limit) html += `<div class="sep" id="more">Loading more…</div>`;
  $("feed").innerHTML = html;
  const m = $("more"); if (m) moreObs.observe(m);
  renderFooter();
}

function renderFooter(){
  let f = `${stories.length} stories from the last 7 days`;
  if (sourcesInfo){
    const total = sourcesInfo.ok + sourcesInfo.failed.length;
    f += ` · ${total} sources checked every 10 minutes`;
    if (sourcesInfo.failed.length) f += `<br><span class="down">Not responding right now: ${esc(sourcesInfo.failed.join(", "))}</span>`;
  }
  $("foot").innerHTML = f;
}

function updateStatus(){
  if (!generatedAt) return;
  const stale = Date.now() - generatedAt > 45*60000;
  $("status").classList.toggle("stale", stale);
  $("live").textContent = stale ? "Delayed" : "Live";
  $("synced").textContent = "· updated " + ago(generatedAt);
  $("status").title = "Last update: " + new Date(generatedAt).toLocaleString();
}

/* ---------- loading ---------- */
async function load(){
  try{
    const r = await fetch("feed.json?t=" + Date.now(), {cache:"no-store"});
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    if (!firstLoad && data.generated_at === lastGen){ updateStatus(); return; }
    lastGen = data.generated_at;
    const fresh = normalize(data);
    const newIds = new Set(firstLoad ? [] : fresh.filter(s => !known.has(s.id)).map(s => s.id));
    newIds.forEach(id => arrivedLive.add(id));
    stories = fresh; stories.forEach(s => known.add(s.id));
    render(newIds);
    if (newIds.size && window.scrollY > 200){
      $("newpill").textContent = `↑ ${newIds.size} new ${newIds.size===1?"story":"stories"}`;
      $("newpill").style.display = "block";
    }

    firstLoad = false;
    updateStatus();
  }catch(e){
    $("status").classList.add("stale");
    $("live").textContent = "Offline"; $("synced").textContent = "· retrying";
    if (!stories.length) $("feed").innerHTML = `<div class="empty"><b>Couldn't load the wall</b>Check your connection. Retrying every minute.</div>`;
  }
}

/* ---------- events ---------- */
const moreObs = new IntersectionObserver(es => {
  if (es.some(e => e.isIntersecting)){ moreObs.disconnect(); limit += 120; render(); }
}, {rootMargin: "600px"});

function setTopic(t){ topic = t; store.set("wall.topic", t); limit = 120; render(); window.scrollTo({top:0, behavior:"smooth"}); }
function setSource(s){ source = s; store.set("wall.source", s); limit = 120; render(); window.scrollTo({top:0, behavior:"smooth"}); }
function resetFilters(){ topic = "all"; source = "all"; store.set("wall.topic","all"); store.set("wall.source","all"); limit = 120; render(); }

$("topics").addEventListener("click", e => { const b = e.target.closest("[data-topic]"); if (b) setTopic(b.dataset.topic); });
$("sources").addEventListener("click", e => { const b = e.target.closest("[data-source]"); if (b) setSource(b.dataset.source); });
$("reset").addEventListener("click", resetFilters);
$("feed").addEventListener("click", e => {
  if (e.target.closest("[data-act=reset]")) return resetFilters();
  if (e.target.closest("a")) return;
  const c = e.target.closest(".card"); if (!c) return;
  const id = c.dataset.id;
  c.classList.toggle("open");
  c.classList.contains("open") ? opened.add(id) : opened.delete(id);
  const tg = c.querySelector(".toggle");
  if (tg && /^(Show|Hide) all/.test(tg.textContent.trim())) tg.firstChild.textContent = (c.classList.contains("open") ? "Hide" : "Show") + tg.firstChild.textContent.replace(/^(Show|Hide)/, "");
  seen.add(id); saveSeen();
  const u = c.querySelector(".new-badge"); if (u) u.remove();
});
let qTimer;
$("q").addEventListener("input", e => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => {
    query = e.target.value.trim();
    terms = query.toLowerCase().split(/\s+/).filter(Boolean);
    $("clear").hidden = !query;
    limit = 120; render(); window.scrollTo({top:0});
  }, 150);
});
$("q").addEventListener("keydown", e => {
  if (e.key === "Escape"){ e.target.value = ""; e.target.dispatchEvent(new Event("input")); }
  if (e.key === "Enter") e.target.blur();
});
$("clear").addEventListener("click", e => { e.preventDefault(); $("q").value = ""; $("q").dispatchEvent(new Event("input")); $("q").focus(); });
$("newpill").addEventListener("click", () => { window.scrollTo({top:0, behavior:"smooth"}); $("newpill").style.display="none"; });
window.addEventListener("scroll", () => { if (window.scrollY < 100) $("newpill").style.display = "none"; }, {passive:true});
document.addEventListener("visibilitychange", () => { if (document.hidden) markVisit(); else load(); });
window.addEventListener("pagehide", markVisit);

load();
setInterval(load, POLL_MS);
setInterval(updateStatus, 15000);
</script>
</body>
</html>
